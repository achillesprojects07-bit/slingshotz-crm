<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F0E6" />
  <title>Καθημερινά Fluency · Phase 5</title>
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Καθημερινά Fluency</p>
        <h1 id="page-title">Today</h1>
      </div>
      <button id="diagnostics-button" class="icon-button" aria-label="Open app health">⋯</button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-route="today" class="nav-item is-active"><span>⌂</span><small>Today</small></button>
      <button data-route="path" class="nav-item"><span>◌</span><small>Path</small></button>
      <button data-route="review" class="nav-item"><span>↻</span><small>Review</small></button>
      <button data-route="library" class="nav-item"><span>▦</span><small>Library</small></button>
      <button data-route="progress" class="nav-item"><span>▥</span><small>Progress</small></button>
    </nav>
  </div>

  <dialog id="diagnostics-dialog" class="dialog">
    <form method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">Diagnostics</p>
          <h2>App Health</h2>
        </div>
        <button class="icon-button" aria-label="Close">×</button>
      </div>
      <div id="diagnostics-content"></div>
    </form>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
