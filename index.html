<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slingshotz CRM</title>
<style>
  :root{
    --bg:#f1f4f9; --card:#ffffff; --ink:#1c2433; --muted:#64748b; --line:#e2e8f0;
    --brand:#1d4ed8; --brand-dark:#1e40af; --brand-soft:#dbeafe;
    --good:#047857; --good-soft:#d1fae5;
    --warn:#b45309; --warn-soft:#fef3c7;
    --bad:#b91c1c; --bad-soft:#fee2e2;
    --meet:#6d28d9; --meet-soft:#ede9fe;
    --radius:10px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
  h1{font-size:20px} h2{font-size:16px;margin-bottom:10px} h3{font-size:14px}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;transition:background .15s}
  .btn:hover{background:#f8fafc}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-danger{background:#fff;border-color:#fca5a5;color:var(--bad)}
  .btn-danger:hover{background:var(--bad-soft)}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--brand)}
  .btn-ghost:hover{background:var(--brand-soft)}

  /* ---------- login ---------- */
  #login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:32px;width:100%;max-width:380px}
  .login-logo{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px}
  .login-logo span{color:var(--brand)}
  .login-sub{color:var(--muted);margin-bottom:22px;font-size:13px}
  .login-card .field{margin-bottom:14px}
  .login-err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:8px}

  /* ---------- app shell ---------- */
  #app-view{display:none;min-height:100vh}
  header.app{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .hdr-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
  .brand span{color:var(--brand)}
  .hdr-spacer{flex:1}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:700;letter-spacing:.04em}
  .badge-demo{background:var(--warn-soft);color:var(--warn)}
  .badge-live{background:var(--bad-soft);color:var(--bad)}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px}
  .user-chip b{font-size:13px}
  .user-chip small{color:var(--muted)}
  nav.tabs{background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs-inner{max-width:1280px;margin:0 auto;display:flex;gap:2px;padding:0 10px}
  .tab-btn{border:0;background:transparent;padding:11px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
  .tab-btn.active{color:var(--brand);border-bottom-color:var(--brand)}
  main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}

  /* ---------- cards / panels ---------- */
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;cursor:pointer;border:2px solid transparent;transition:border .15s}
  .stat-card:hover{border-color:var(--brand-soft)}
  .stat-card.selected{border-color:var(--brand)}
  .stat-card .num{font-size:26px;font-weight:800;line-height:1.1}
  .stat-card .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
  .filter-bar .field{min-width:130px;flex:1;max-width:220px}
  .quick-ranges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .chip:hover{border-color:var(--brand);color:var(--brand)}

  /* ---------- tables ---------- */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:9px 10px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#fafbfd}
  .nowrap{white-space:nowrap}

  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
  .pill-good{background:var(--good-soft);color:var(--good)}
  .pill-meet{background:var(--meet-soft);color:var(--meet)}
  .pill-retry{background:var(--warn-soft);color:var(--warn)}
  .pill-closed{background:var(--bad-soft);color:var(--bad)}
  .pill-neutral{background:#e2e8f0;color:#475569}

  .empty{padding:34px 16px;text-align:center;color:var(--muted)}
  .empty .big{font-size:30px;margin-bottom:6px}
  .loading{padding:34px 16px;text-align:center;color:var(--muted)}
  .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-4px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .error-box{padding:20px;text-align:center;color:var(--bad)}

  /* ---------- follow-up cards ---------- */
  .fu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .fu-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px;display:flex;flex-direction:column;gap:7px}
  .fu-card .co{font-weight:700;font-size:14.5px}
  .fu-card .meta{font-size:12.5px;color:var(--muted)}
  .fu-card .due{font-weight:700;font-size:12.5px}
  .due-overdue{color:var(--bad)} .due-today{color:var(--warn)} .due-upcoming{color:var(--good)} .due-needs{color:var(--meet)}
  .fu-card .notes{font-size:12.5px;background:#f8fafc;border-radius:7px;padding:7px}
  .fu-actions{display:flex;gap:7px;margin-top:auto;padding-top:5px}

  /* ---------- modal ---------- */
  #modal-root{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;background:rgba(15,23,42,.5);padding:24px 12px;overflow-y:auto}
  #modal-root.open{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(15,23,42,.3);margin:auto 0}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0}
  .modal-x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:2px 8px}
  .modal-body{padding:18px;max-height:72vh;overflow-y:auto}
  .modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid .full{grid-column:1/-1}
  .hist-item{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:12.5px}
  .hist-item .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:3px}

  /* ---------- toast ---------- */
  #toast-root{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:#1c2433;color:#fff;border-radius:9px;padding:10px 18px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);animation:pop .2s ease}
  .toast.success{background:var(--good)} .toast.error{background:var(--bad)}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

  #config-banner{display:none;background:var(--bad);color:#fff;text-align:center;padding:9px 14px;font-weight:600;font-size:13px}

  .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding-top:10px;font-size:13px;color:var(--muted)}
  .attn-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .attn-p1{border-left-color:var(--bad)} .attn-p2{border-left-color:var(--meet)} .attn-p3{border-left-color:var(--brand)}
  .attn-p4{border-left-color:var(--warn)} .attn-p5{border-left-color:var(--good)} .attn-p6{border-left-color:#94a3b8}
  .insights li{margin-left:18px;margin-bottom:4px;color:var(--muted)}
  .score-bar{background:#e2e8f0;border-radius:999px;height:7px;width:90px;display:inline-block;vertical-align:middle;overflow:hidden}
  .score-bar i{display:block;height:100%;background:var(--brand)}
  .src-badge{font-size:10.5px;font-weight:700;border-radius:5px;padding:1.5px 6px;background:#e2e8f0;color:#475569;white-space:nowrap}
  .src-badge.call{background:var(--brand-soft);color:var(--brand)}

  @media(max-width:640px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .form-grid{grid-template-columns:1fr}
    .filter-bar .field{max-width:none}
    main{padding:12px 10px 60px}
    .hdr-inner{padding:9px 10px}
  }
</style>
</head>
<body>

<div id="config-banner">⚠ API_URL is not set. Open index.html and paste your Apps Script Web App /exec URL into API_URL near the top of the script.</div>

<!-- ============================ LOGIN ============================ -->
<div id="login-view">
  <div class="login-card">
    <div class="login-logo">SLING<span>SHOTZ</span></div>
    <div class="login-sub">Telemarketing CRM — sign in to continue</div>
    <div class="field">
      <label for="login-user">User</label>
      <select id="login-user"><option value="">Loading users…</option></select>
    </div>
    <div class="field">
      <label for="login-pin">PIN</label>
      <input id="login-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Enter your PIN">
    </div>
    <div class="login-err" id="login-err"></div>
    <button class="btn btn-primary" id="login-btn" style="width:100%">Login</button>
  </div>
</div>

<!-- ============================ APP ============================== -->
<div id="app-view">
  <header class="app">
    <div class="hdr-inner">
      <div class="brand">SLING<span>SHOTZ</span> CRM</div>
      <span class="badge badge-demo" id="mode-badge">DEMO</span>
      <button class="btn btn-sm" id="mode-switch" style="display:none">Switch mode</button>
      <div class="hdr-spacer"></div>
      <div class="user-chip">
        <span><b id="hdr-name"></b> <small id="hdr-role"></small></span>
        <button class="btn btn-sm" id="logout-btn">Logout</button>
      </div>
    </div>
  </header>
  <nav class="tabs"><div class="tabs-inner" id="tab-bar"></div></nav>
  <main id="tab-content"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* =====================================================================
 * SLINGSHOTZ CRM — FRONTEND
 * Backend: Google Apps Script Web App (api.gs). All communication is
 * GET requests with query parameters; every response is JSON {ok:...}.
 * ===================================================================== */

// ⬇⬇⬇ PASTE YOUR APPS SCRIPT WEB APP URL (ends in /exec) HERE ⬇⬇⬇
const API_URL = 'https://script.google.com/macros/s/AKfycbwov4NPqYNVKUokep_8crBARjgkmV0wizcJoCyxLFs5AT2oERSM2Fo6NqpmW2tvIQNI/exec';

const CALL_RESULTS = [
  'ASKED TO CALL BACK','BIDDING REQUIREMENT','BUSY / TRY AGAIN','COMPANY PROFILE SENT',
  'COMPANY PROFILE MEETING SET','CONTACT PERSON NOT AVAILABLE','EVENT IDENTIFIED',
  'PROJECT BRIEFING MEETING SET','NO ANSWER','NO REQUIREMENT','NOT INTERESTED',
  'NUMBER UNREACHABLE','WRONG NUMBER'
];
const MEANINGFUL = new Set(['ASKED TO CALL BACK','BIDDING REQUIREMENT','COMPANY PROFILE SENT','COMPANY PROFILE MEETING SET','EVENT IDENTIFIED','PROJECT BRIEFING MEETING SET']);
const RETRY = new Set(['NO ANSWER','BUSY / TRY AGAIN','CONTACT PERSON NOT AVAILABLE']);
const MEETING = new Set(['COMPANY PROFILE MEETING SET','PROJECT BRIEFING MEETING SET']);
const CLOSED = new Set(['NO REQUIREMENT','NOT INTERESTED','NUMBER UNREACHABLE','WRONG NUMBER']);
const PAGE_SIZE = 50;

const state = {
  user: null,            // {code,name,role,canAddEvents,canSwitchLive}
  mode: 'DEMO',
  tab: null,
  users: [],             // for dropdowns
  queue: null,           // Add Targets cache {companies, categories}
  queueFilters: { cat:'', search:'', page:1 },
  dashCard: 'targets',   // selected agent dashboard card
  mgrKpi: 'calls',       // selected manager KPI
  mgrFilters: null,
  perfFilters: null,
  trailFilters: null,
  eventFilters: { search:'', category:'', venue:'', range:'all' },
  lastReport: null,      // agent dashboard report cache
  lastMgrReport: null
};

/* ----------------------------- utilities ----------------------------- */

const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(d){ const x=d||new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return todayStr(d); }
function monthStart(){ const d=new Date(); return todayStr(new Date(d.getFullYear(),d.getMonth(),1)); }

function toast(msg, type){
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  $('#toast-root').appendChild(t);
  setTimeout(()=>t.remove(), 3800);
}

async function api(action, params){
  if (API_URL.indexOf('http') !== 0) throw new Error('API_URL is not configured in index.html.');
  const q = new URLSearchParams(Object.assign({action, mode: state.mode}, params||{}));
  let res;
  try { res = await fetch(API_URL + '?' + q.toString()); }
  catch(e){ throw new Error('Cannot reach the backend. Check your connection and the Apps Script deployment.'); }
  let data;
  try { data = await res.json(); }
  catch(e){ throw new Error('Backend did not return JSON. Re-deploy the Apps Script web app (new version, access: Anyone).'); }
  if (!data.ok) throw new Error(data.error || 'Unknown backend error.');
  return data;
}

function loadingHtml(msg){ return '<div class="loading"><span class="spinner"></span>'+esc(msg||'Loading…')+'</div>'; }
function emptyHtml(icon,msg){ return '<div class="empty"><div class="big">'+(icon||'📭')+'</div>'+esc(msg)+'</div>'; }
function errorHtml(msg){ return '<div class="error-box">⚠ '+esc(msg)+'<br><br><button class="btn btn-sm" data-action="reload-tab">Retry</button></div>'; }

function resultPill(result){
  result = String(result||'').toUpperCase();
  let cls='pill-neutral';
  if (MEETING.has(result)) cls='pill-meet';
  else if (MEANINGFUL.has(result)) cls='pill-good';
  else if (RETRY.has(result)) cls='pill-retry';
  else if (CLOSED.has(result)) cls='pill-closed';
  return '<span class="pill '+cls+'">'+esc(result||'—')+'</span>';
}

function dueLabel(f){
  if (f.needsDate) return '<span class="due due-needs">Needs follow-up date</span>';
  const map={'overdue':['due-overdue','Overdue: '],'due-today':['due-today','Due today: '],'upcoming':['due-upcoming','Follow-up: ']};
  const m=map[f.dueState]||['due-upcoming',''];
  return '<span class="due '+m[0]+'">'+m[1]+esc(f.followUpDate)+'</span>';
}

/* ------------------------------- modal -------------------------------- */

function openModal(html){
  const root=$('#modal-root');
  root.innerHTML='<div class="modal">'+html+'</div>';
  root.classList.add('open');
  root.onclick=e=>{ if(e.target===root) closeModal(); };
  return root;
}
function closeModal(){ const r=$('#modal-root'); r.classList.remove('open'); r.innerHTML=''; }

/* ---------------------------- action router --------------------------- */
// One delegated click handler; buttons declare data-action + data-* context.

const ACTIONS = {};
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, el.dataset); }
});

ACTIONS['reload-tab'] = () => renderTab(state.tab);
ACTIONS['close-modal'] = () => closeModal();

/* ------------------------------- login -------------------------------- */

async function initLogin(){
  if (API_URL.indexOf('http') !== 0){
    $('#config-banner').style.display='block';
    $('#login-user').innerHTML='<option value="">API not configured</option>';
    return;
  }
  try{
    const data = await api('getUsers', {});
    state.users = data.users;
    const active = data.users.filter(u=>u.active);
    $('#login-user').innerHTML = '<option value="">Select your user…</option>' +
      active.map(u=>'<option value="'+esc(u.code)+'">'+esc(u.code)+' — '+esc(u.name)+'</option>').join('');
  }catch(err){
    $('#login-user').innerHTML='<option value="">Could not load users</option>';
    $('#login-err').textContent = err.message;
  }
}

$('#login-btn').addEventListener('click', doLogin);
$('#login-pin').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const code=$('#login-user').value, pin=$('#login-pin').value;
  const err=$('#login-err'); err.textContent='';
  if(!code){ err.textContent='Please select your user.'; return; }
  if(!pin){ err.textContent='Please enter your PIN.'; return; }
  const btn=$('#login-btn'); btn.disabled=true; btn.textContent='Logging in…';
  try{
    const data = await api('login', {code, pin});
    state.user = data.user;
    $('#login-pin').value='';
    enterApp();
  }catch(e2){
    err.textContent = e2.message;
  }finally{
    btn.disabled=false; btn.textContent='Login';
  }
}

function logout(){
  state.user=null; state.queue=null; state.lastReport=null; state.lastMgrReport=null;
  $('#app-view').style.display='none';
  $('#login-view').style.display='flex';
}
$('#logout-btn').addEventListener('click', logout);

/* ------------------------------ app shell ----------------------------- */

const AGENT_TABS = [
  {id:'dash', label:'Dashboard', render: renderAgentDashboard},
  {id:'targets', label:'My Target List', render: renderTargets},
  {id:'add', label:'Add Targets', render: renderAddTargets},
  {id:'followups', label:'My Follow-Ups', render: renderFollowups},
  {id:'activity', label:'Activity Log', render: renderAgentActivity},
  {id:'events', label:'Events Leads', render: renderEvents},
  {id:'leaderboard', label:'Leaderboard', render: renderLeaderboard}
];
const MANAGER_TABS = [
  {id:'command', label:'Command Center', render: renderCommandCenter},
  {id:'performance', label:'Agent Performance', render: renderPerformance},
  {id:'worktrail', label:'Work Trail', render: renderWorkTrail},
  {id:'events', label:'Events Leads', render: renderEvents},
  {id:'edithistory', label:'Company Edit History', render: renderEditHistory},
  {id:'users', label:'Users / Settings', render: renderUsers}
];

function tabsFor(){ return state.user.role==='MANAGER' ? MANAGER_TABS : AGENT_TABS; }

function enterApp(){
  $('#login-view').style.display='none';
  $('#app-view').style.display='block';
  $('#hdr-name').textContent = state.user.name + ' ('+state.user.code+')';
  $('#hdr-role').textContent = state.user.role==='MANAGER' ? '· Manager' : '· Telemarketer';
  updateModeBadge();
  const canSwitch = state.user.role==='MANAGER' || state.user.canSwitchLive;
  $('#mode-switch').style.display = canSwitch ? 'inline-flex' : 'none';
  const tabs = tabsFor();
  $('#tab-bar').innerHTML = tabs.map(t=>'<button class="tab-btn" data-action="goto-tab" data-tab="'+t.id+'">'+esc(t.label)+'</button>').join('');
  renderTab(tabs[0].id);
}

function updateModeBadge(){
  const b=$('#mode-badge');
  b.textContent=state.mode;
  b.className='badge '+(state.mode==='LIVE'?'badge-live':'badge-demo');
  $('#mode-switch').textContent = state.mode==='LIVE' ? 'Switch to DEMO' : 'Switch to LIVE';
}

$('#mode-switch').addEventListener('click', async ()=>{
  const next = state.mode==='LIVE' ? 'DEMO' : 'LIVE';
  if (next==='LIVE' && !confirm('Switch to LIVE mode?\n\nAll calls, targets and events will be written to the LIVE operational sheets.')) return;
  const prev = state.mode;
  state.mode = next;
  state.queue=null; state.lastReport=null; state.lastMgrReport=null;
  updateModeBadge();
  toast('Now in '+next+' mode');
  renderTab(state.tab);
  try{ await api('logBreadcrumb',{user:state.user.code,type:'MODE SWITCH',details:prev+' → '+next}); }catch(e){/* non-blocking */}
});

ACTIONS['goto-tab'] = (el,d)=> renderTab(d.tab);

async function renderTab(tabId){
  const tabs = tabsFor();
  const tab = tabs.find(t=>t.id===tabId) || tabs[0];
  state.tab = tab.id;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab.id));
  const c = $('#tab-content');
  c.innerHTML = loadingHtml('Loading '+tab.label+'…');
  try{ await tab.render(c); }
  catch(err){ c.innerHTML = '<div class="panel">'+errorHtml(err.message)+'</div>'; }
}

/* ====================== shared row renderers ========================== */

function callActions(companyId, companyName){
  return '<button class="btn btn-sm btn-primary" data-action="open-call" data-cid="'+esc(companyId)+'" data-cname="'+esc(companyName)+'">Open / Log</button> '+
         '<button class="btn btn-sm" data-action="view-history" data-cid="'+esc(companyId)+'" data-cname="'+esc(companyName)+'">History</button>';
}

function callTable(rows, opts){
  opts=opts||{};
  if(!rows.length) return emptyHtml('📞','No call records here yet.');
  return '<div class="table-wrap"><table><thead><tr>'+
    '<th>Date</th>'+(opts.hideAgent?'':'<th>Agent</th>')+'<th>Company</th><th>Result</th><th>Follow-up</th><th>Client Event</th><th>Notes</th><th></th>'+
    '</tr></thead><tbody>'+
    rows.map(c=>'<tr>'+
      '<td class="nowrap">'+esc(c.timestamp||c.loggedAt||'')+'</td>'+
      (opts.hideAgent?'':'<td>'+esc(c.agent)+'</td>')+
      '<td><b>'+esc(c.companyName)+'</b><br><small style="color:var(--muted)">'+esc(c.companyId)+'</small></td>'+
      '<td>'+resultPill(c.result)+'</td>'+
      '<td class="nowrap">'+esc(c.followUpDate||'—')+'</td>'+
      '<td>'+(c.clientEventName?esc(c.clientEventName)+(c.clientEventDate?'<br><small>'+esc(c.clientEventDate)+'</small>':''):'—')+'</td>'+
      '<td style="max-width:230px">'+esc(c.notes||'')+'</td>'+
      '<td class="nowrap">'+callActions(c.companyId,c.companyName)+'</td>'+
    '</tr>').join('')+
    '</tbody></table></div>';
}

function followupCards(rows){
  if(!rows.length) return emptyHtml('✅','No open follow-ups. Nice and clean!');
  return '<div class="fu-grid">'+rows.map(f=>'<div class="fu-card">'+
    '<div class="co">'+esc(f.companyName)+'</div>'+
    '<div class="meta">'+esc(f.companyId)+' · Agent: <b>'+esc(f.agent)+'</b> · Logged '+esc(f.loggedAt)+'</div>'+
    '<div>'+resultPill(f.result)+'</div>'+
    '<div>'+dueLabel(f)+'</div>'+
    (f.clientEventName?'<div class="meta">🎪 '+esc(f.clientEventName)+(f.clientEventDate?' ('+esc(f.clientEventDate)+')':'')+'</div>':'')+
    (f.notes?'<div class="notes">'+esc(f.notes)+'</div>':'')+
    '<div class="fu-actions">'+
      '<button class="btn btn-sm btn-primary" data-action="open-call" data-cid="'+esc(f.companyId)+'" data-cname="'+esc(f.companyName)+'">Open / Log</button>'+
      '<button class="btn btn-sm" data-action="view-history" data-cid="'+esc(f.companyId)+'" data-cname="'+esc(f.companyName)+'">View Call History</button>'+
    '</div>'+
  '</div>').join('')+'</div>';
}

function targetTable(rows){
  if(!rows.length) return emptyHtml('🎯','Your target list is empty. Add companies from the Add Targets tab.');
  return '<div class="table-wrap"><table><thead><tr><th>Company</th><th>Attempts</th><th>Last Result</th><th>Last Call</th><th>Added</th><th></th></tr></thead><tbody>'+
    rows.map(t=>'<tr>'+
      '<td><b>'+esc(t.companyName)+'</b><br><small style="color:var(--muted)">'+esc(t.companyId)+'</small></td>'+
      '<td>'+t.attempts+' / 3</td>'+
      '<td>'+(t.lastResult?resultPill(t.lastResult):'<span class="pill pill-neutral">NOT CALLED YET</span>')+'</td>'+
      '<td class="nowrap">'+esc(t.lastCallDate||'—')+'</td>'+
      '<td class="nowrap">'+esc(t.addedAt||'')+'</td>'+
      '<td class="nowrap">'+callActions(t.companyId,t.companyName)+
        ' <button class="btn btn-sm btn-danger" data-action="remove-target" data-cid="'+esc(t.companyId)+'">Remove</button></td>'+
    '</tr>').join('')+'</tbody></table></div>';
}

const DASH_CARDS = [
  {key:'targets', label:'My Target List'},
  {key:'followups', label:'My Follow-Ups'},
  {key:'meetings', label:'My Meetings Set'},
  {key:'needsAction', label:'Needs Action'},
  {key:'dailyTarget', label:'Daily Target'},
  {key:'completedToday', label:'Completed Today'},
  {key:'remainingToday', label:'Remaining Today'}
];

async function renderAgentDashboard(c){
  const rep = await api('getAgentDashboardReport', {user: state.user.code});
  state.lastReport = rep;
  c.innerHTML =
    '<div class="cards">'+DASH_CARDS.map(card=>
      '<div class="stat-card'+(state.dashCard===card.key?' selected':'')+'" data-action="dash-card" data-key="'+card.key+'">'+
      '<div class="num">'+rep.counts[card.key]+'</div><div class="lbl">'+card.label+'</div></div>').join('')+
    '</div>'+
    '<div class="panel"><div class="section-title"><h2 id="dash-detail-title"></h2></div><div id="dash-detail"></div></div>';

ACTIONS['dash-card'] = (el,d)=>{
  state.dashCard = d.key;
  document.querySelectorAll('.stat-card').forEach(x=>x.classList.toggle('selected', x.dataset.key===d.key));
  renderDashDetail();
};

function renderDashDetail(){
  const rep = state.lastReport; if(!rep) return;
  const box=$('#dash-detail'), title=$('#dash-detail-title');
  if(!box) return;
  const key = state.dashCard;
  if (key==='targets'){ title.textContent='My Target List ('+rep.counts.targets+')'; box.innerHTML=targetTable(rep.targets); }
  else if (key==='followups'){ title.textContent='My Follow-Ups ('+rep.counts.followups+')'; box.innerHTML=followupCards(rep.followups); }
  else if (key==='meetings'){ title.textContent='My Meetings Set ('+rep.counts.meetings+')'; box.innerHTML=followupCards(rep.meetings); }
  else if (key==='needsAction'){ title.textContent='Needs Action — retry cases ('+rep.counts.needsAction+')'; box.innerHTML=targetTable(rep.needsAction); }
  else { title.textContent='Calls Completed Today ('+rep.counts.completedToday+' of '+rep.counts.dailyTarget+')'; box.innerHTML=callTable(rep.todayCalls,{hideAgent:true}); }
}

ACTIONS['queue-refresh'] = ()=>{ state.queue=null; renderTab('add'); };

function filteredQueue(){
  const f=state.queueFilters;
  let list = state.queue.companies;
  if (f.cat) list = list.filter(co=>co.category===f.cat);
  if (f.search) list = list.filter(co=>{
    const hay=(co.companyName+' '+co.companyId+' '+co.primaryContact+' '+co.phone+' '+co.mobile+' '+co.email+' '+co.category).toLowerCase();
    return hay.indexOf(f.search)!==-1;
  });
  return list;
}

function renderQueueList(){
  const box=$('#q-list'); if(!box) return;
  const f=state.queueFilters;
  const list=filteredQueue();
  const pages=Math.max(1, Math.ceil(list.length/PAGE_SIZE));
  if (f.page>pages) f.page=pages;
  const start=(f.page-1)*PAGE_SIZE;
  const page=list.slice(start, start+PAGE_SIZE);
  const isMgr = state.user.role==='MANAGER';
  if(!list.length){ box.innerHTML=emptyHtml('🔍','No companies match your filters.'); return; }
  box.innerHTML =
    '<div class="table-wrap"><table><thead><tr><th>Company</th><th>Category</th><th>Contact</th><th>Phone / Mobile</th><th>Owner / Status</th><th></th></tr></thead><tbody>'+
    page.map(co=>'<tr>'+
      '<td><b>'+esc(co.companyName)+'</b><br><small style="color:var(--muted)">'+esc(co.companyId)+'</small></td>'+
      '<td>'+esc(co.category||'—')+'</td>'+
      '<td>'+esc(co.primaryContact||'—')+(co.title?'<br><small style="color:var(--muted)">'+esc(co.title)+'</small>':'')+'</td>'+
      '<td class="nowrap">'+esc(co.phone||'—')+(co.mobile?'<br>'+esc(co.mobile):'')+'</td>'+
      '<td>'+(co.owner?'<b>'+esc(co.owner)+'</b><br>':'')+(co.accountStatus?'<span class="pill pill-neutral">'+esc(co.accountStatus)+'</span>':'—')+'</td>'+
      '<td class="nowrap">'+
        (co.alreadyAdded
          ? '<button class="btn btn-sm" disabled>Already Added</button>'
          : '<button class="btn btn-sm btn-primary" data-action="add-target" data-cid="'+esc(co.companyId)+'" data-cname="'+esc(co.companyName)+'">Add to Targets</button>')+
        ' <button class="btn btn-sm" data-action="view-history" data-cid="'+esc(co.companyId)+'" data-cname="'+esc(co.companyName)+'">History</button>'+
        (isMgr?' <button class="btn btn-sm btn-ghost" data-action="edit-company" data-cid="'+esc(co.companyId)+'">Edit</button>':'')+
      '</td>'+
    '</tr>').join('')+'</tbody></table></div>'+
    '<div class="pager">Showing '+(start+1)+'–'+(start+page.length)+' of '+list.length+
      ' <button class="btn btn-sm" data-action="q-page" data-dir="-1" '+(f.page<=1?'disabled':'')+'>‹ Prev</button>'+
      ' Page '+f.page+' / '+pages+
      ' <button class="btn btn-sm" data-action="q-page" data-dir="1" '+(f.page>=pages?'disabled':'')+'>Next ›</button></div>';
}

ACTIONS['q-page'] = (el,d)=>{ state.queueFilters.page += Number(d.dir); renderQueueList(); };

      '<td><b>'+esc(ev.eventName)+'</b><br><small style="color:var(--muted)">'+esc(ev.category||'')+' · '+esc(ev.eventId)+'</small>'+

function dateAgentBar(f, idPrefix, applyAction){
  return '<div class="quick-ranges">'+

      '<button class="chip" data-action="'+applyAction+'-quick" data-q="7">Last 7 Days</button>'+

function readBar(idPrefix, f){
  f.from=$('#'+idPrefix+'-from').value;
  f.to=$('#'+idPrefix+'-to').value;
  f.agent=$('#'+idPrefix+'-agent').value;
}

function quickRange(f, q){
  if(q==='today'){ f.from=todayStr(); f.to=todayStr(); }
  else if(q==='7'){ f.from=addDays(-6); f.to=todayStr(); }
  else if(q==='30'){ f.from=addDays(-29); f.to=todayStr(); }
  else if(q==='month'){ f.from=monthStart(); f.to=todayStr(); }
  else { f.from=''; f.to=''; }
}

async function renderCommandCenter(c){
  if(!state.mgrFilters) state.mgrFilters={from:addDays(-6), to:todayStr(), agent:'ALL'};
  const f=state.mgrFilters;
  c.innerHTML='<div class="panel">'+dateAgentBar(f,'cc','cc-apply')+'</div><div id="cc-body">'+loadingHtml('Loading command center…')+'</div>';
  await loadCommandCenter();
}

async function loadCommandCenter(){
  const f=state.mgrFilters;
  const body=$('#cc-body'); if(!body) return;
  try{
    const rep = await api('getManagerDashboardReport', {fromDate:f.from, toDate:f.to, agent:f.agent});
    state.lastMgrReport = rep;
    body.innerHTML =
      '<div class="cards">'+MGR_KPIS.map(k=>
        '<div class="stat-card'+(state.mgrKpi===k.key?' selected':'')+'" data-action="cc-kpi" data-key="'+k.key+'">'+
        '<div class="num">'+rep.kpis[k.kpi]+'</div><div class="lbl">'+k.label+'</div></div>').join('')+'</div>'+
      '<div class="panel"><h2>Insights</h2><ul class="insights">'+rep.insights.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></div>'+

ACTIONS['cc-kpi']=(el,d)=>{
  state.mgrKpi=d.key;
  document.querySelectorAll('#cc-body .stat-card').forEach(x=>x.classList.toggle('selected', x.dataset.key===d.key));
  renderMgrDrill();
};

function renderMgrDrill(){
  const rep=state.lastMgrReport; if(!rep) return;
  const box=$('#cc-drill'), title=$('#cc-drill-title'); if(!box) return;
  const k = MGR_KPIS.find(x=>x.key===state.mgrKpi) || MGR_KPIS[0];
  const rows = rep.lists[k.key] || [];
  title.textContent = k.label + ' (' + rows.length + ')';
  box.innerHTML = (k.key==='followupsDue') ? followupCards(rows) : callTable(rows);
}

function attentionList(items){
  if(!items.length) return emptyHtml('🧘','Nothing needs attention right now.');
  return items.map(it=>'<div class="attn-item attn-p'+it.priority+'">'+
    '<div style="flex:1"><b>'+esc(it.companyName)+'</b> <small style="color:var(--muted)">'+esc(it.companyId)+' · '+esc(it.agent)+'</small>'+
    '<div style="font-size:12.5px;margin-top:2px"><b>'+esc(it.reason)+'</b> · '+resultPill(it.result)+

    '<div class="nowrap">'+callActions(it.companyId,it.companyName)+'</div>'+

function snapshotTable(stats){
  if(!stats.length) return emptyHtml('📊','No agent activity in this range.');

    stats.map(s=>'<tr><td><b>'+esc(s.agent)+'</b></td><td>'+s.calls+'</td><td>'+s.meaningful+'</td><td>'+s.conversion+'%</td>'+

ACTIONS['user-save']=async (el,d)=>{
  const isNew=d.new==='true';
  const code=isNew?$('#um-code').value.trim().toUpperCase():d.code;
  const name=$('#um-name').value.trim();
  if(!code||!name){ toast('User code and name are required','error'); return; }
  el.disabled=true; el.textContent='Saving…';
  try{
    const common={by:state.user.code, code, name, role:$('#um-role').value, canAddEvents:$('#um-events').value, canSwitchLive:$('#um-live').value};
    if(isNew){
      const pin=$('#um-pin').value.trim();
      if(!pin){ toast('PIN is required for a new user','error'); el.disabled=false; el.textContent='Save User'; return; }
      await api('addUser', Object.assign({pin}, common));
    } else {
      await api('updateUser', common);
    }
    toast('User saved','success');
    closeModal();
    renderTab('users');
  }catch(e){ toast(e.message,'error'); el.disabled=false; el.textContent='Save User'; }
};

    closeModal();
    state.lastReport=null; state.lastMgrReport=null;
    renderTab(state.tab); // reload whatever list the user is looking at
  }catch(e){ toast(e.message,'error'); el.disabled=false; el.textContent='Save Call'; }
};

/* ===================== COMPANY EDIT MODAL (manager) =================== */

ACTIONS['edit-company']=(el,d)=>{
  const co=state.queue && state.queue.companies.find(x=>x.companyId===d.cid);
  if(co) openCompanyModal(co);
};

function openCompanyModal(co){
  openModal(
    '<div class="modal-head"><h2>Edit Company — '+esc(co.companyName)+'</h2><button class="modal-x" data-action="close-modal">×</button></div>'+
    '<div class="modal-body"><div class="form-grid">'+
      '<div class="full"><label>Company Name *</label><input id="com-name" value="'+esc(co.companyName)+'"></div>'+
      '<div><label>Industry / Category</label><input id="com-cat" value="'+esc(co.category)+'"></div>'+
      '<div><label>Primary Contact</label><input id="com-contact" value="'+esc(co.primaryContact)+'"></div>'+
      '<div><label>Title</label><input id="com-title" value="'+esc(co.title)+'"></div>'+
      '<div><label>Email</label><input id="com-email" value="'+esc(co.email)+'"></div>'+
      '<div><label>Phone</label><input id="com-phone" value="'+esc(co.phone)+'"></div>'+
      '<div><label>Mobile</label><input id="com-mobile" value="'+esc(co.mobile)+'"></div>'+
      '<div class="full"><label>Other Contacts</label><input id="com-other" value="'+esc(co.otherContacts)+'"></div>'+
      '<div class="full"><label>Events Participated</label><input id="com-events" value="'+esc(co.eventsParticipated)+'"></div>'+
      '<div class="full"><label>Possible Requirements</label><input id="com-req" value="'+esc(co.possibleRequirements)+'"></div>'+
    '</div></div>'+
    '<div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button>'+
    '<button class="btn btn-primary" data-action="company-save" data-cid="'+esc(co.companyId)+'">Save Company</button></div>'
  );
}

ACTIONS['company-save']=async (el,d)=>{
  const name=$('#com-name').value.trim();
  if(!name){ toast('Company name is required','error'); return; }
  el.disabled=true; el.textContent='Saving…';
  try{
    const fields={
      user: state.user.code, companyId: d.cid, companyName: name,
      category: $('#com-cat').value.trim(), primaryContact: $('#com-contact').value.trim(),
      title: $('#com-title').value.trim(), email: $('#com-email').value.trim(),
      phone: $('#com-phone').value.trim(), mobile: $('#com-mobile').value.trim(),
      otherContacts: $('#com-other').value.trim(), eventsParticipated: $('#com-events').value.trim(),
      possibleRequirements: $('#com-req').value.trim()
    };
    const r=await api('upsertCompany', fields);
    // keep the local cache in sync so the table reflects the edit instantly
    const co=state.queue && state.queue.companies.find(x=>x.companyId===d.cid);
    if(co){
      co.companyName=name; co.category=fields.category; co.primaryContact=fields.primaryContact;
      co.title=fields.title; co.email=fields.email; co.phone=fields.phone; co.mobile=fields.mobile;
      co.otherContacts=fields.otherContacts; co.eventsParticipated=fields.eventsParticipated;
      co.possibleRequirements=fields.possibleRequirements;
    }
    toast(r.message,'success');
    closeModal();
    if(state.tab==='add') renderQueueList();
  }catch(e){ toast(e.message,'error'); el.disabled=false; el.textContent='Save Company'; }
};

/* -------------------------------- boot -------------------------------- */
initLogin();
</script>
