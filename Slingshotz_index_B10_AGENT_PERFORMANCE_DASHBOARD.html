<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Slingshotz CRM</title>
<style>
  :root{
    --bg:#f1f4f9; --card:#ffffff; --ink:#1c2433; --muted:#64748b; --line:#e2e8f0;
    --brand:#1d4ed8; --brand-dark:#1e40af; --brand-soft:#dbeafe;
    --good:#047857; --good-soft:#d1fae5;
    --warn:#b45309; --warn-soft:#fef3c7;
    --bad:#b91c1c; --bad-soft:#fee2e2;
    --meet:#6d28d9; --meet-soft:#ede9fe;
    --radius:10px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
  h1{font-size:20px} h2{font-size:16px;margin-bottom:10px} h3{font-size:14px}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;transition:background .15s}
  .btn:hover{background:#f8fafc}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-danger{background:#fff;border-color:#fca5a5;color:var(--bad)}
  .btn-danger:hover{background:var(--bad-soft)}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--brand)}
  .btn-ghost:hover{background:var(--brand-soft)}

  /* ---------- login ---------- */
  #login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:32px;width:100%;max-width:380px}
  .login-logo{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px}
  .login-logo span{color:var(--brand)}
  .login-sub{color:var(--muted);margin-bottom:22px;font-size:13px}
  .login-card .field{margin-bottom:14px}
  .login-err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:8px}

  /* ---------- app shell ---------- */
  #app-view{display:none;min-height:100vh}
  header.app{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .hdr-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
  .brand span{color:var(--brand)}
  .hdr-spacer{flex:1}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:700;letter-spacing:.04em}
  .badge-demo{background:var(--warn-soft);color:var(--warn)}
  .badge-live{background:var(--bad-soft);color:var(--bad)}
  .build-tag{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;letter-spacing:.04em}
  .build-tag strong{color:var(--brand);font-weight:900}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px}
  .user-chip b{font-size:13px}
  .user-chip small{color:var(--muted)}
  nav.tabs{background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs-inner{max-width:1280px;margin:0 auto;display:flex;gap:2px;padding:0 10px}
  .tab-btn{border:0;background:transparent;padding:11px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
  .tab-btn.active{color:var(--brand);border-bottom-color:var(--brand)}
  main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}

  /* ---------- cards / panels ---------- */
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;cursor:pointer;border:2px solid transparent;transition:border .15s}
  .stat-card:hover{border-color:var(--brand-soft)}
  .stat-card.selected{border-color:var(--brand)}
  .stat-card .num{font-size:26px;font-weight:800;line-height:1.1}
  .stat-card .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
  .stat-card .sub{font-size:10.8px;color:var(--muted);margin-top:4px;line-height:1.25}
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
  .filter-bar .field{min-width:130px;flex:1;max-width:220px}
  .quick-ranges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .chip:hover{border-color:var(--brand);color:var(--brand)}

  /* ---------- tables ---------- */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:9px 10px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#fafbfd}
  .nowrap{white-space:nowrap}

  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
  .pill-good{background:var(--good-soft);color:var(--good)}
  .pill-meet{background:var(--meet-soft);color:var(--meet)}
  .pill-retry{background:var(--warn-soft);color:var(--warn)}
  .pill-closed{background:var(--bad-soft);color:var(--bad)}
  .pill-neutral{background:#e2e8f0;color:#475569}

  .empty{padding:34px 16px;text-align:center;color:var(--muted)}
  .empty .big{font-size:30px;margin-bottom:6px}
  .loading{padding:34px 16px;text-align:center;color:var(--muted)}
  .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-4px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .error-box{padding:20px;text-align:center;color:var(--bad)}

  /* ---------- follow-up cards ---------- */
  .fu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .fu-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px;display:flex;flex-direction:column;gap:7px}
  .fu-card .co{font-weight:700;font-size:14.5px}
  .fu-card .meta{font-size:12.5px;color:var(--muted)}
  .fu-card .due{font-weight:700;font-size:12.5px}
  .due-overdue{color:var(--bad)} .due-today{color:var(--warn)} .due-upcoming{color:var(--good)} .due-needs{color:var(--meet)}
  .fu-card .notes{font-size:12.5px;background:#f8fafc;border-radius:7px;padding:7px}
  .fu-actions{display:flex;gap:7px;margin-top:auto;padding-top:5px}
  .fu-card.fu-urgent{border-color:var(--warn);background:var(--warn-soft)}

  /* ---------- modal ---------- */
  #modal-root{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;background:rgba(15,23,42,.5);padding:24px 12px;overflow-y:auto}
  #modal-root.open{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(15,23,42,.3);margin:auto 0}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0}
  .modal-x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:2px 8px}
  .modal-body{padding:18px;max-height:72vh;overflow-y:auto}
  .modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid .full{grid-column:1/-1}
  .hist-item{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:12.5px}
  .hist-item .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:3px}

  /* ---------- toast ---------- */
  #toast-root{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:#1c2433;color:#fff;border-radius:9px;padding:10px 18px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);animation:pop .2s ease}
  .toast.success{background:var(--good)} .toast.error{background:var(--bad)}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

  #config-banner{display:none;background:var(--bad);color:#fff;text-align:center;padding:9px 14px;font-weight:600;font-size:13px}

  .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding-top:10px;font-size:13px;color:var(--muted)}
  .attn-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .attn-p1{border-left-color:var(--bad)} .attn-p2{border-left-color:var(--meet)} .attn-p3{border-left-color:var(--brand)}
  .attn-p4{border-left-color:var(--warn)} .attn-p5{border-left-color:var(--good)} .attn-p6{border-left-color:#94a3b8}
  .insights li{margin-left:18px;margin-bottom:4px;color:var(--muted)}
  .score-bar{background:#e2e8f0;border-radius:999px;height:7px;width:90px;display:inline-block;vertical-align:middle;overflow:hidden}
  .score-bar i{display:block;height:100%;background:var(--brand)}
  .src-badge{font-size:10.5px;font-weight:700;border-radius:5px;padding:1.5px 6px;background:#e2e8f0;color:#475569;white-space:nowrap}
  .src-badge.call{background:var(--brand-soft);color:var(--brand)}

  /* ---------- phone / QR ---------- */
  .phone-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;margin-top:3px}
  .phone-line .num{font-weight:700;white-space:nowrap}
  .btn-xs{padding:3px 8px;font-size:11.5px;border-radius:6px}
  .no-phone{color:var(--muted);font-size:11.5px;font-style:italic;margin-top:3px}
  .orig-phone{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-word}
  .contact-raw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:9px}
  .contact-raw-box{border:1px solid var(--line);border-radius:8px;background:#f8fafc;padding:8px}
  .contact-raw-box b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
  .contact-raw-box span{font-size:12.5px;word-break:break-word}
  .extracted-list{border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:9px;padding:8px}
  .extracted-list b.head{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
  .extracted-item{border-top:1px solid #eef2f7;padding-top:7px;margin-top:7px;font-size:12.5px}
  .extracted-item:first-of-type{border-top:0;padding-top:0;margin-top:0}
  .reason-note{margin-top:7px;color:var(--muted);font-size:12.5px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:7px}

  .review-status-box{border:1px solid var(--line);border-radius:8px;background:#f8fafc;margin-top:8px;padding:8px;font-size:12.5px}
  .review-status-box b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
  .review-status-reviewed{background:var(--good-soft);border-color:#86efac;color:#065f46}
  .review-status-manager{background:var(--warn-soft);border-color:#fcd34d;color:#92400e}
  .review-status-open{background:#f8fafc;color:var(--muted)}
  .review-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .btn-viber{background:#7360f2;border-color:#7360f2;color:#fff}
  .btn-viber:hover{background:#5f4dd0}
  .qr-box{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .qr-box svg{border:1px solid var(--line);border-radius:10px;background:#fff}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .stats-grid .stat{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px}
  .stats-grid .stat b{display:block;font-size:20px}
  .stats-grid .stat span{font-size:11.5px;color:var(--muted);font-weight:600}

  /* ---------- today's call funnel ---------- */
  .funnel-flow{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .funnel-row{display:flex;align-items:center;justify-content:space-between;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13.5px}
  .funnel-sub{margin-left:24px;border-radius:7px;padding:7px 12px;font-size:12.5px}

  /* ---------- visual dashboard clarity ---------- */
  .dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:16px}
  .bar-list{display:flex;flex-direction:column;gap:9px}
  .bar-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(90px,2fr) 34px;gap:10px;align-items:center;font-size:13px}
  .bar-label{font-weight:650;color:var(--ink)}
  .bar-track{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;background:var(--brand);border-radius:999px;min-width:0}
  .bar-value{text-align:right;font-weight:800;color:var(--ink)}
  .group-block{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;background:#fff}
  .group-head{background:#f8fafc;padding:8px 11px;font-weight:800;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
  .group-row{display:grid;grid-template-columns:minmax(180px,1fr) 44px;gap:8px;padding:7px 11px;border-bottom:1px solid #f1f5f9;align-items:center;font-size:12.5px}
  .group-row:last-child{border-bottom:0}
  .group-row b{text-align:right;font-size:14px}
  .action-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}
  .action-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#f8fafc}
  .action-card b{display:block;font-size:22px;line-height:1}
  .action-card span{display:block;color:var(--muted);font-weight:650;font-size:12px;margin-top:4px}
  @media(max-width:640px){.bar-row{grid-template-columns:1fr 1.4fr 30px}.dashboard-grid{grid-template-columns:1fr}}

  @media(max-width:640px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .form-grid{grid-template-columns:1fr}
    .filter-bar .field{max-width:none}
    main{padding:12px 10px 60px}
    .hdr-inner{padding:9px 10px}
  }
</style>
</head>
<body>

<div id="config-banner">⚠ API_URL is not set. Open index.html and paste your Apps Script Web App /exec URL into API_URL near the top of the script.</div>

<!-- ============================ LOGIN ============================ -->
<div id="login-view">
  <div class="login-card">
    <div class="login-logo">SLING<span>SHOTZ</span></div>
    <div class="login-sub">Telemarketing CRM — sign in to continue · <b id="login-build-tag">B10 AGENT PERFORMANCE DASHBOARD</b></div>
    <div class="field">
      <label for="login-user">User</label>
      <select id="login-user"><option value="">Loading users…</option></select>
    </div>
    <div class="field">
      <label for="login-pin">PIN</label>
      <input id="login-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Enter your PIN">
    </div>
    <div class="login-err" id="login-err"></div>
    <button class="btn btn-primary" id="login-btn" style="width:100%">Login</button>
  </div>
</div>

<!-- ============================ APP ============================== -->
<div id="app-view">
  <header class="app">
    <div class="hdr-inner">
      <div class="brand">SLING<span>SHOTZ</span> CRM</div>
      <span class="badge badge-demo" id="mode-badge">DEMO</span>
      <span class="build-tag" id="app-build-tag">B10 AGENT PERFORMANCE DASHBOARD</span>
      <button class="btn btn-sm" id="mode-switch" style="display:none">Switch mode</button>
      <div class="hdr-spacer"></div>
      <div class="user-chip">
        <span><b id="hdr-name"></b> <small id="hdr-role"></small></span>
        <button class="btn btn-sm" id="logout-btn">Logout</button>
      </div>
    </div>
  </header>
  <nav class="tabs"><div class="tabs-inner" id="tab-bar"></div></nav>
  <main id="tab-content"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>

<script>
/* =====================================================================
 * SLINGSHOTZ CRM — FRONTEND
 * Backend: Google Apps Script Web App (api.gs). All communication is
 * GET requests with query parameters; every response is JSON {ok:...}.
 * ===================================================================== */

// ⬇⬇⬇ PASTE YOUR APPS SCRIPT WEB APP URL (ends in /exec) HERE ⬇⬇⬇
const API_URL = 'https://script.google.com/macros/s/AKfycbwov4NPqYNVKUokep_8crBARjgkmV0wizcJoCyxLFs5AT2oERSM2Fo6NqpmW2tvIQNI/exec';

const CALL_RESULT_GROUPS = [
  {label:'No Contact / Try Again', results:['NO ANSWER','BUSY / TRY AGAIN']},
  {label:'Follow-Up / Nurture', results:['CONTACT PERSON NOT AVAILABLE','ASKED TO CALL BACK','COMPANY PROFILE SENT','EVENT IDENTIFIED','BIDDING REQUIREMENT']},
  {label:'Meetings Booked', results:['COMPANY PROFILE MEETING SET','PROJECT BRIEFING MEETING SET']},
  {label:'Review Company Details', results:['WRONG NUMBER','NUMBER UNREACHABLE']},
  {label:'Closed / Not Leads', results:['NO REQUIREMENT','NOT INTERESTED']}
];
const CALL_RESULTS = CALL_RESULT_GROUPS.flatMap(g=>g.results);
const MEANINGFUL = new Set(['CONTACT PERSON NOT AVAILABLE','ASKED TO CALL BACK','BIDDING REQUIREMENT','COMPANY PROFILE SENT','COMPANY PROFILE MEETING SET','EVENT IDENTIFIED','PROJECT BRIEFING MEETING SET']);
const RETRY = new Set(['NO ANSWER','BUSY / TRY AGAIN']);
const MEETING = new Set(['COMPANY PROFILE MEETING SET','PROJECT BRIEFING MEETING SET']);
const FOLLOWUP_RESULTS_FRONT = new Set(['CONTACT PERSON NOT AVAILABLE','ASKED TO CALL BACK','COMPANY PROFILE SENT','EVENT IDENTIFIED','BIDDING REQUIREMENT']);
const CLOSED = new Set(['NO REQUIREMENT','NOT INTERESTED']);
const REVIEW_DETAILS = new Set(['WRONG NUMBER','NUMBER UNREACHABLE']);
const PAGE_SIZE = 50;
const APP_BUILD = 'B10 AGENT PERFORMANCE DASHBOARD';
const BID_STAGES = ['IDENTIFIED','QUALIFYING','PROPOSAL PREP','SUBMITTED','AWARDED','LOST','NO DECISION'];
const BID_CLOSED_STAGES = new Set(['AWARDED','LOST','NO DECISION']);
const MEETING_UPDATE_STATUSES = ['SCHEDULED','DONE','RESCHEDULED','CANCELLED','NO SHOW'];
const MEETING_FILTER_STATUSES = ['SCHEDULED','NEEDS MEETING OUTCOME','DONE','RESCHEDULED','CANCELLED','NO SHOW'];
function normalizeMeetingStatus(s){ s=String(s||'SCHEDULED').toUpperCase().trim(); return s==='PREPARING' ? 'SCHEDULED' : s; }
function isPastMeetingDate(s){
  s = String(s||'').trim();
  if(!s) return false;
  const d = new Date(s+'T00:00:00');
  const t = new Date(todayStr()+'T00:00:00');
  return !isNaN(d.getTime()) && d < t;
}
function meetingDisplayStatus(m){
  const raw = normalizeMeetingStatus((m && m.meetingStatus) || 'SCHEDULED');
  if(raw==='SCHEDULED' && isPastMeetingDate(m && m.meetingDate)) return 'NEEDS MEETING OUTCOME';
  return raw;
}

const state = {
  user: null,            // {code,name,role,canAddEvents,canSwitchLive}
  pin: null,             // plaintext PIN kept in session for API auth headers
  mode: 'DEMO',
  tab: null,
  users: [],             // for dropdowns
  queue: null,           // Add Targets cache {companies, categories}
  queueFilters: { cat:'', search:'', eventsJoined:'', page:1 },
  dashCard: 'completedToday',   // selected agent dashboard card
  mgrKpi: 'calls',       // selected manager KPI
  dashFilters: null,
  mgrFilters: null,
  perfFilters: null,
  trailFilters: null,
  bidFilters: null,
  meetingFilters: null,
  eventFilters: { search:'', category:'', venue:'', range:'all' },
  cleanupKind: '',
  lastReport: null,      // agent dashboard report cache
  lastMgrReport: null
};

/* ----------------------------- utilities ----------------------------- */

const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(d){ const x=d||new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return todayStr(d); }
function monthStart(){ const d=new Date(); return todayStr(new Date(d.getFullYear(),d.getMonth(),1)); }

function toast(msg, type){
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  $('#toast-root').appendChild(t);
  setTimeout(()=>t.remove(), 3800);
}

async function api(action, params){
  if (API_URL.indexOf('http') !== 0) throw new Error('API_URL is not configured in index.html.');
  // Auto-include authenticated user's code + PIN on every call so routes can verify the caller.
  // Explicit params spread last so callers can still override (e.g. agent filter on work trail).
  const auth = {};
  if (state.user) { auth.user = state.user.code; auth.by = state.user.code; }
  if (state.pin)  { auth.pin = state.pin; }
  const q = new URLSearchParams(Object.assign({action, mode: state.mode}, auth, params||{}));
  let res;
  try { res = await fetch(API_URL + '?' + q.toString()); }
  catch(e){ throw new Error('Cannot reach the backend. Check your connection and the Apps Script deployment.'); }
  let data;
  try { data = await res.json(); }
  catch(e){ throw new Error('Backend did not return JSON. Re-deploy the Apps Script web app (new version, access: Anyone).'); }
  if (!data.ok) throw new Error(data.error || 'Unknown backend error.');
  return data;
}

function loadingHtml(msg){ return '<div class="loading"><span class="spinner"></span>'+esc(msg||'Loading…')+'</div>'; }
function emptyHtml(icon,msg){ return '<div class="empty"><div class="big">'+(icon||'📭')+'</div>'+esc(msg)+'</div>'; }
function errorHtml(msg){ return '<div class="error-box">⚠ '+esc(msg)+'<br><br><button class="btn btn-sm" data-action="reload-tab">Retry</button></div>'; }

function resultPill(result){
  result = String(result||'').toUpperCase();
  let cls='pill-neutral';
  if (MEETING.has(result)) cls='pill-meet';
  else if (MEANINGFUL.has(result)) cls='pill-good';
  else if (RETRY.has(result)) cls='pill-retry';
  else if (typeof REVIEW_DETAILS !== 'undefined' && REVIEW_DETAILS.has(result)) cls='pill-retry';
  else if (CLOSED.has(result)) cls='pill-closed';
  return '<span class="pill '+cls+'">'+esc(result||'—')+'</span>';
}

function callResultOptions(selected){
  selected = String(selected||'').toUpperCase();
  return CALL_RESULT_GROUPS.map(g=>
    '<optgroup label="'+esc(g.label)+'">'+
    g.results.map(r=>'<option value="'+esc(r)+'"'+(selected===r?' selected':'')+'>'+esc(r)+'</option>').join('')+
    '</optgroup>'
  ).join('');
}

function countByResult(rows){
  const counts = {};
  (rows||[]).forEach(r=>{
    const key = String((r && (r.result || r.callResult || r.CALL_RESULT)) || '').toUpperCase().trim();
    if(key) counts[key]=(counts[key]||0)+1;
  });
  return counts;
}

function sumResults(counts, names){
  return names.reduce((total,name)=>total+(Number(counts[name])||0),0);
}

function productiveBreakdownFromRows(rows){
  const counts = countByResult(rows);
  return [

}

function totalCount(items){ return (items||[]).reduce((n,x)=>n+(Number(x.count)||0),0); }

function barList(items){
  items = items || [];
  const max = Math.max(1, ...items.map(x=>Number(x.count)||0));
  return '<div class="bar-list">'+items.map(x=>{
    const count = Number(x.count)||0;
    const pct = Math.max(0, Math.round((count/max)*100));
    return '<div class="bar-row"><div class="bar-label">'+esc(x.label)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="bar-value">'+count+'</div></div>';

}

/* ------------------- phone / call helpers (clean layer) ---------------- */
// All Call / QR actions use ONLY the cleaned DIAL NUMBER from the
// COMPANY CONTACT NUMBERS layer — never the raw original phone text.
// Opening the dialer never auto-logs a call: the agent still clicks
// Open / Log after the call.

function phoneBtns(r){
  var ctx = ' data-dial="'+esc(r.primaryPhoneDial)+'" data-display="'+esc(r.primaryPhoneDisplay)+'" data-cname="'+esc(r.companyName||'')+'" data-cid="'+esc(r.companyId||'')+'"';
  var isMobile = String(r.primaryPhoneDial||'').charAt(0) === '+';
  return ' <button class="btn btn-xs btn-primary" data-action="call-phone"'+ctx+'>\uD83D\uDCDE Call</button>'+
         ' <button class="btn btn-xs" data-action="qr-call"'+ctx+'>\u25A6 QR Call</button>'+
         (isMobile ? ' <button class="btn btn-xs" data-action="qr-msg"'+ctx+'>\uD83D\uDCAC QR Msg</button>'+
                     ' <button class="btn btn-xs btn-viber" data-action="viber-chat"'+ctx+'>Viber</button>' : '');
}

function viewNumbersBtn(r, label){
  return '<button class="btn btn-xs" data-action="view-numbers" data-cid="'+esc(r.companyId||'')+'" data-cname="'+esc(r.companyName||'')+'">'+esc(label||'View Numbers')+'</button>';
}

// One-line phone block used on cards and table rows.
function phoneLine(r){
  if (!r || r.phoneValidationStatus === undefined) return '';
  if (r.hasCleanPhone){
    return '<div class="phone-line"><span class="num">'+esc(r.primaryPhoneDisplay)+'</span>'+phoneBtns(r)+
      (r.phoneCount>1 ? viewNumbersBtn(r, '+'+(r.phoneCount-1)+' more') : '')+'</div>';
  }
  if (r.phoneValidationStatus === 'REVIEW'){
    return '<div class="phone-line"><span class="num">'+esc(r.primaryPhoneDisplay)+'</span>'+
      '<span class="pill pill-retry">Needs review</span>'+viewNumbersBtn(r)+'</div>';
  }
  return '<div class="no-phone">No clean phone number</div>';
}

function callPhoneNumber(dialNumber, companyName, companyId){
  if (!dialNumber){ toast('No valid phone number available','error'); return; }
  toast('Opening dialer for '+(companyName||'company')+'\u2026 After the call, tap Open / Log to record the result.');
  window.location.href = 'tel:' + dialNumber;
}

function qrSvgFor_(data){
  var qr = qrcode(0, 'M');
  qr.addData(data);
  qr.make();
  return qr.createSvgTag({cellSize: 6, margin: 4});
}

// qrMode: 'call' (TEL: — uppercase scheme, best scanner compatibility) or
// 'sms' (SMSTO: standard). Message QR is only offered for mobile (+63) numbers.
function showCallQrModal(companyId, companyName, dialNumber, displayNumber, qrMode){
  if (!dialNumber){ toast('No valid phone number available','error'); return; }
  var isMobile = dialNumber.charAt(0) === '+';
  qrMode = (qrMode === 'sms' && isMobile) ? 'sms' : 'call';
  var data = qrMode === 'sms' ? 'SMSTO:' + dialNumber + ':' : 'TEL:' + dialNumber;
  var svg = '';
  try{ svg = qrSvgFor_(data); }
  catch(e){ toast('Could not generate QR code','error'); return; }
  var ctx = ' data-dial="'+esc(dialNumber)+'" data-display="'+esc(displayNumber||'')+'" data-cname="'+esc(companyName||'')+'" data-cid="'+esc(companyId||'')+'"';
  var toggle = isMobile ?
    '<div style="display:flex;gap:8px;justify-content:center">'+
      '<button class="btn btn-sm'+(qrMode==='call'?' btn-primary':'')+'" data-action="qr-mode" data-mode="call"'+ctx+'>📞 Call QR</button>'+
      '<button class="btn btn-sm'+(qrMode==='sms'?' btn-primary':'')+'" data-action="qr-mode" data-mode="sms"'+ctx+'>💬 Message QR</button>'+
    '</div>' : '';
  var instructions = qrMode === 'sms'
    ? 'Scan this with your phone camera. Your phone will open a <b>new text message</b> to this number. After messaging, return here and click <b>Open / Log</b> to record the result.'
    : 'Scan this with your phone camera. Your phone will open the <b>dialer</b>. After the call, return here and click <b>Open / Log</b> to record the result.';
  openModal(
    '<div class="modal-head"><h2>'+(qrMode==='sms'?'Scan to Message':'Scan to Call')+'</h2><button class="modal-x" data-action="close-modal">×</button></div>'+
    '<div class="modal-body"><div class="qr-box">'+
      toggle+
      '<div style="font-weight:700;font-size:16px">'+esc(companyName||'')+'</div>'+
      '<div style="font-size:19px;font-weight:800">'+esc(displayNumber||dialNumber)+'</div>'+
      svg+
      '<div style="color:var(--muted);max-width:400px">'+instructions+'</div>'+
    '</div></div>'+
    '<div class="modal-foot"><button class="btn" data-action="close-modal">Close</button></div>');
}

ACTIONS['qr-mode'] = (el,d)=> showCallQrModal(d.cid, d.cname, d.dial, d.display, d.mode);

async function initLogin(){
  const lb=$('#login-build-tag'); if(lb) lb.textContent=APP_BUILD;
  if (API_URL.indexOf('http') !== 0){
    $('#config-banner').style.display='block';
    $('#login-user').innerHTML='<option value="">API not configured</option>';
    return;
  }
  try{
    const data = await api('getLoginUsers', {});
    const active = data.users; // already filtered to active users by the backend
    $('#login-user').innerHTML = '<option value="">Select your user…</option>' +
      active.map(u=>'<option value="'+esc(u.code)+'">'+esc(u.code)+' — '+esc(u.name)+'</option>').join('');
  }catch(err){
    $('#login-user').innerHTML='<option value="">Could not load users</option>';
    $('#login-err').textContent = err.message;
  }
}

$('#login-btn').addEventListener('click', doLogin);
$('#login-pin').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const code=$('#login-user').value, pin=$('#login-pin').value;
  const err=$('#login-err'); err.textContent='';
  if(!code){ err.textContent='Please select your user.'; return; }
  if(!pin){ err.textContent='Please enter your PIN.'; return; }
  const btn=$('#login-btn'); btn.disabled=true; btn.textContent='Logging in…';
  try{
    const data = await api('login', {code, pin});
    state.user = data.user;
    state.pin  = pin;        // keep plaintext PIN in session for API auth
    $('#login-pin').value='';
    enterApp();
  }catch(e2){
    err.textContent = e2.message;
  }finally{
    btn.disabled=false; btn.textContent='Login';
  }
}

function logout(){
  state.user=null; state.pin=null; state.queue=null; state.lastReport=null; state.lastMgrReport=null; state.bidFilters=null; state.meetingFilters=null;
  $('#app-view').style.display='none';
  $('#login-view').style.display='flex';
}

async function renderTab(tabId){
  const tabs = tabsFor();
  const tab = tabs.find(t=>t.id===tabId) || tabs[0];
  state.tab = tab.id;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab.id));
  const c = $('#tab-content');
  c.innerHTML = loadingHtml('Loading '+tab.label+'…');
  try{ await tab.render(c); }
  catch(err){ c.innerHTML = '<div class="panel">'+errorHtml(err.message)+'</div>'; }
}

function retryAttemptHtml(t){
  const attempts = Number(t && t.attempts) || 0;
  const last = String((t && t.lastResult) || '').toUpperCase();
  const status = String((t && t.status) || '').toUpperCase();
  const cap = status==='RETRY CAP REACHED' || (attempts >= 3 && RETRY.has(last));
  if(cap) return '<b>'+attempts+' / 3</b><br><span class="pill pill-retry">Cap reached</span>';
  if(RETRY.has(last)) return '<b>'+attempts+' / 3</b><br><small style="color:var(--muted)">Retry active</small>';
  return '<b>'+attempts+' / 3</b>';
}

/* ========================= AGENT: DASHBOARD =========================== */

function renderFunnel(todayCalls, needsActionCount){
  const fRow = (bg,text,count,cls)=>
    '<div class="funnel-row'+(cls?' '+cls:'')+'" style="background:'+bg+';color:#fff"><span>'+text+'</span><b>'+count+'</b></div>';
  todayCalls = todayCalls || [];
  const counts = countByResult(todayCalls);
  const noContact = sumResults(counts, Array.from(RETRY));
  const closed    = sumResults(counts, Array.from(CLOSED));
  const productive = productiveBreakdownFromRows(todayCalls);
  const productiveTotal = totalCount(productive);
  const total = todayCalls.length;
  if(!total && !needsActionCount) return '';
  return '<div class="panel"><div class="section-title"><h2>My Call Funnel Today</h2></div>'+
    '<div class="funnel-flow">'+
    fRow('#1A3A6B','📞 Calls Made Today',total)+
    (productiveTotal ? fRow('#047857','Productive Calls',productiveTotal) : '')+
    productive.filter(x=>x.count).map(x=>fRow('#F59E0B','↳ '+esc(x.label),x.count,'funnel-sub')).join('')+
    (noContact ? fRow('#6b7280','Calls to Retry',noContact) : '')+
    (closed    ? fRow('var(--bad)','Closed / Not Leads',closed) : '')+
    (needsActionCount ? fRow('#F97316','Retry Cap Reached',needsActionCount) : '')+
    '</div></div>';
}

const DASH_CARDS = [
  {key:'completedToday', label:'My Calls Today'},
  {key:'productiveToday', label:'My Productive Calls'},
  {key:'meetings', label:'My Meetings Booked'},
  {key:'followups', label:'My Follow-Ups Due'},
  {key:'retryToday', label:'My Calls to Retry'},
  {key:'needsAction', label:'Retry Cap Reached'},
  {key:'targetProgress', label:'My Target Progress'}
];

function agentDashCardValue(card, rep, rangeCalls){
  rangeCalls = rangeCalls || rep.todayCalls || [];
  const counts = countByResult(rangeCalls);
  if(card.key==='completedToday') return isTodayRange(state.dashFilters) ? (rangeCalls.length||0)+' / '+(rep.counts.dailyTarget||0) : rangeCalls.length;
  if(card.key==='productiveToday') return totalCount(productiveBreakdownFromRows(rangeCalls));
  if(card.key==='retryToday') return sumResults(counts, Array.from(RETRY));
  if(card.key==='needsAction') return rep.counts.needsAction || 0;
  if(card.key==='targetProgress') return (rep.counts.completedToday||0)+' / '+(rep.counts.dailyTarget||0);
  return rep.counts[card.key] || 0;
}


function isTodayRange(f){ return f && f.from===todayStr() && f.to===todayStr(); }

function callRowsFromActivity(entries){
  return (entries||[]).filter(en=>String(en.type||'').toUpperCase()==='CALL LOGGED').map(en=>{
    const details = String(en.details||'');
    const parts = details.split('|').map(x=>x.trim());
    const result = parts[0] || '';
    let followUpDate = '';
    const fm = details.match(/follow-up\s+([0-9]{4}-[0-9]{2}-[0-9]{2})/i);
    if(fm) followUpDate = fm[1];
    return {
      timestamp: en.timestamp || '',
      agent: en.agent || state.user.code,
      companyId: en.companyId || '',
      companyName: en.company || '',
      result: result,
      followUpDate: followUpDate,
      clientEventName: '',
      clientEventDate: '',
      notes: details
    };
  });
}

async function agentDashboardCallsForRange(rep, f){
  if(isTodayRange(f)) return rep.todayCalls || [];
  const data = await api('getMyActivity', {fromDate:f.from, toDate:f.to, type:'calls'});
  return callRowsFromActivity(data.entries || []);
}

function dashRangeWord(){
  const f=state.dashFilters || {from:todayStr(),to:todayStr()};
  return isTodayRange(f) ? 'Today' : 'in Range';
}

function agentDashLabel(card){
  const w = dashRangeWord();
  if(card.key==='completedToday') return isTodayRange(state.dashFilters) ? 'My Calls Today' : 'My Calls in Range';
  if(card.key==='productiveToday') return isTodayRange(state.dashFilters) ? 'My Productive Calls Today' : 'My Productive Calls in Range';
  if(card.key==='retryToday') return isTodayRange(state.dashFilters) ? 'My Calls to Retry Today' : 'My Calls to Retry in Range';
  if(card.key==='needsAction') return 'Retry Cap Reached';
  if(card.key==='meetings') return 'My Meetings Booked';
  if(card.key==='followups') return 'My Open Follow-Ups';
  if(card.key==='targetProgress') return 'My Target Progress Today';
  return card.label;
}

  if(!state.dashFilters) state.dashFilters={from:todayStr(), to:todayStr()};
  c.innerHTML = '<div class="panel">'+dashboardDateBar(state.dashFilters,'ad','ad-apply')+'</div>'+loadingHtml('Loading dashboard…');

    title.textContent='My Target Progress Today ('+(rep.counts.completedToday||0)+' / '+(rep.counts.dailyTarget||0)+')';

    const retryRows = rangeCalls.filter(c=>RETRY.has(String(c.result||'').toUpperCase()));
    title.textContent='My Calls to Retry — '+rangeText+' ('+retryRows.length+')';
    box.innerHTML=callTable(retryRows,{hideAgent:true});
  }
  else if (key==='productiveToday'){
    const productiveRows = rangeCalls.filter(c=>MEANINGFUL.has(String(c.result||'').toUpperCase()));
    title.textContent='My Productive Calls — '+rangeText+' ('+productiveRows.length+')';
    box.innerHTML=callTable(productiveRows,{hideAgent:true});
  }
  else {
    title.textContent='My Calls — '+rangeText+' ('+rangeCalls.length+')';
    box.innerHTML=callTable(rangeCalls,{hideAgent:true});
  }
}

async function initFinderPanel(events){
  // stats from current data + last import
  const li = state.lastImport || {};
  const today = todayStr();
  const next6 = (events||[]).filter(ev=>ev.daysUntilEvent!=='' && ev.daysUntilEvent>=0 && ev.daysUntilEvent<=183).length;
  const approved = (events||[]).filter(ev=>ev.leadStatus.toUpperCase()==='APPROVED FOR PROSPECTING').length;
  let needsReview = '\u2026';
  const stats = [
    ['Events Found', li.eventsFound!==undefined?li.eventsFound:'\u2014'],
    ['Imported', li.eventsImported!==undefined?li.eventsImported:'\u2014'],
    ['Needs Review', needsReview],
    ['Approved for Prospecting', approved],
    ['Duplicates Skipped', li.duplicatesSkipped!==undefined?li.duplicatesSkipped:'\u2014'],
    ['Next 6 Months', next6]
  ];
  const box=$('#pef-stats');
  if(box) box.innerHTML = stats.map(s=>'<div class="stat-card" style="cursor:default"><div class="num">'+s[1]+'</div><div class="lbl">'+s[0]+'</div></div>').join('');
  try{
    if(!state.eventSources){ state.eventSources = (await api('getEventSources',{})).sources; }
    const sel=$('#pef-source');
    if(sel) sel.innerHTML='<option value="">All active sources</option>'+state.eventSources.map(s=>'<option value="'+esc(s.sourceId)+'">'+esc(s.sourceName)+'</option>').join('');
    const cand = await api('getPublicEventCandidates',{});
    state.pefCandidates = cand.candidates;
    const nr=document.querySelectorAll('#pef-stats .stat-card')[2];
    if(nr) nr.querySelector('.num').textContent = cand.count;
  }catch(e){ /* panel stays usable; import button will surface errors */ }
}

function scorePill(ev){
  const cls = ev.priority==='HIGH'?'pill-good':(ev.priority==='MEDIUM'?'pill-retry':'pill-neutral');
  return '<span class="pill '+cls+'">'+ev.opportunityScore+' \u00b7 '+ev.priority+'</span>';
}

function candidateCard(ev){
  return '<div class="attn-item attn-p'+(ev.priority==='HIGH'?'1':(ev.priority==='MEDIUM'?'4':'6'))+'" style="flex-direction:column;align-items:stretch">'+
    '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">'+
      '<div><b>'+esc(ev.eventName)+'</b><br><small style="color:var(--muted)">'+esc(ev.startDate||'?')+(ev.endDate&&ev.endDate!==ev.startDate?' \u2192 '+esc(ev.endDate):'')+' \u00b7 '+esc(ev.venue||'venue?')+(ev.city?' \u00b7 '+esc(ev.city):'')+(ev.organizer?' \u00b7 '+esc(ev.organizer):'')+'</small></div>'+
      '<div>'+scorePill(ev)+' <span class="pill pill-neutral">'+esc(ev.confidenceLevel||'LOW')+'</span> <span class="pill pill-retry">'+esc(ev.reviewStatus)+'</span></div>'+
    '</div>'+
    '<div style="font-size:12.5px;margin-top:4px"><b>'+esc(ev.category||'Needs Review')+'</b>'+(ev.eventType?' \u00b7 '+esc(ev.eventType):'')+
      (ev.targetIndustry?'<br>Targets: '+esc(ev.targetIndustry):'')+
      (ev.possibleRequirements?'<br>Possible needs: '+esc(ev.possibleRequirements):'')+
      (ev.prospectingAngle?'<br><i style="color:var(--muted)">'+esc(ev.prospectingAngle)+'</i>':'')+
      (ev.sourceUrl?'<br><a href="'+esc(ev.sourceUrl)+'" target="_blank" rel="noopener">Source: '+esc(ev.source||ev.sourceUrl)+' \u2197</a>':(ev.source?'<br>Source: '+esc(ev.source):''))+
      (ev.publicListingText?'<div class="orig-phone">Listing: \u201c'+esc(ev.publicListingText)+'\u201d</div>':'')+
    '</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'+
      '<button class="btn btn-sm btn-primary" data-action="pef-approve" data-eid="'+esc(ev.eventId)+'">Approve for Prospecting</button>'+

// "Find Matching Companies": agents jump to Add Targets pre-filtered;
// managers (no Add Targets tab) get a modal of matching COMPANY MASTER rows.
ACTIONS['ev-find-companies']=async (el,d)=>{
  const ev=(state.eventsCache||[]).concat(state.pefCandidates||[]).find(x=>x.eventId===d.eid);
  if(!ev) return;
  const keywords=(ev.category+' '+(ev.targetIndustry||'')).toLowerCase().split(/[^a-z0-9&]+/).filter(k=>k.length>3);
  if(state.user.role!=='MANAGER'){
    state.queueFilters={cat:'',search:keywords[0]||'',page:1};
    renderTab('add');
    toast('Add Targets filtered for "'+(keywords[0]||'')+'" \u2014 adjust search/category as needed');
    return;
  }
  el.disabled=true;
  try{
    if(!state.queue){ state.queue = await api('getCallQueue',{user:state.user.code}); }
    const matches=state.queue.companies.filter(co=>{
      const hay=(co.category+' '+co.companyName).toLowerCase();
      return keywords.some(k=>hay.indexOf(k)!==-1);
    }).slice(0,100);
    openModal('<div class="modal-head"><h2>Matching Companies \u2014 '+esc(ev.eventName)+'</h2><button class="modal-x" data-action="close-modal">\u00d7</button></div>'+
      '<div class="modal-body">'+
      '<p style="color:var(--muted);font-size:12.5px;margin-bottom:10px">Matched on: '+esc(keywords.join(', '))+' \u00b7 showing '+matches.length+' compan'+(matches.length===1?'y':'ies')+'. Agents add targets themselves \u2014 nothing is auto-assigned.</p>'+
      (matches.length ? matches.map(co=>'<div class="hist-item"><div class="top"><span><b>'+esc(co.companyName)+'</b> <small style="color:var(--muted)">'+esc(co.companyId)+' \u00b7 '+esc(co.category)+'</small></span>'+(co.owner?'<span class="pill pill-neutral">'+esc(co.owner)+'</span>':'')+'</div>'+phoneLine(co)+'</div>').join('') : emptyHtml('\ud83d\udd0d','No companies match these keywords.'))+
      '</div><div class="modal-foot"><button class="btn" data-action="close-modal">Close</button></div>');
  }catch(e){ toast(e.message,'error'); }
  el.disabled=false;
};

function rangeLabel(f){
  const today=todayStr(), yesterday=addDays(-1);

  if(f.from===addDays(-6) && f.to===today) return 'Last 7 Days';

  if(f.from || f.to) return (f.from||'Start')+' to '+(f.to||'Today');
  return 'All Dates';

function renderMgrDrill(){
  const rep=state.lastMgrReport; if(!rep) return;
  const box=$('#cc-drill'), title=$('#cc-drill-title'); if(!box) return;
  const allCalls = (rep.lists && rep.lists.calls) ? rep.lists.calls : [];
  const key = state.mgrKpi || 'attention';
  const labelMap = {
    calls:'Calls Completed',
    meaningful:'Productive Calls',
    leadsToFollowUp:'Leads to Follow Up',
    bids:'Proposal / Bid Opportunities',
    followupsDue:'Follow-Ups Due',
    meetings:'Meetings Set',
    attention:'Needs Manager Attention',
    retryCases:'Calls to Retry',
    invalid:'Review Company Details'
  };
  let rows = [];
  if(key==='attention'){
    title.textContent='Needs Manager Attention ('+(rep.attention||[]).length+')';
    box.innerHTML=attentionList(rep.attention||[]);
    return;
  }
  if(key==='leadsToFollowUp') rows = allCalls.filter(c=>['ASKED TO CALL BACK','COMPANY PROFILE SENT','EVENT IDENTIFIED'].includes(String(c.result||'').toUpperCase()));
  else if(key==='bids') rows = allCalls.filter(c=>String(c.result||'').toUpperCase()==='BIDDING REQUIREMENT');
  else if(key==='meaningful') rows = allCalls.filter(c=>MEANINGFUL.has(String(c.result||'').toUpperCase()));
  else if(key==='invalid') rows = allCalls.filter(c=>['WRONG NUMBER','NUMBER UNREACHABLE'].includes(String(c.result||'').toUpperCase()));
  else if(key==='retryCases') rows = allCalls.filter(c=>RETRY.has(String(c.result||'').toUpperCase()));
  else {
    const k = MGR_KPIS.find(x=>x.key===key);
    rows = (rep.lists && k) ? (rep.lists[k.key] || []) : allCalls;
  }
  const label = labelMap[key] || ((MGR_KPIS.find(x=>x.key===key)||{}).label || 'Calls Logged');
  title.textContent = label + ' (' + rows.length + ')';
  box.innerHTML = (key==='followupsDue') ? followupCards(rows) : callTable(rows);
}

    if(params.agent==='ALL') params.agent='';
    if(params.stage==='ALL') params.stage='';

    const data = await api('getBidPipeline',params);
    const byStage = summary.byStage || {};
    const selectedStage = f.stage && f.stage !== 'ALL' ? f.stage : 'ALL';

function meetingStatusPill(status){
  status = String(status||'').toUpperCase();
  let cls='pill-neutral';
  if(status==='NEEDS MEETING OUTCOME') cls='pill-retry';
  else if(status==='SCHEDULED') cls='pill-meet';
  else if(status==='DONE') cls='pill-good';
  else if(status==='RESCHEDULED') cls='pill-retry';
  else if(status==='CANCELLED' || status==='NO SHOW') cls='pill-closed';
  return '<span class="pill '+cls+'">'+esc(status||'—')+'</span>';
}

function meetingFilterStatusOptions(selected, includeAll){
  selected = String(selected||'').toUpperCase();
  const head = includeAll ? '<option value="ALL">All statuses</option>' : '';
  return head + MEETING_FILTER_STATUSES.map(s=>'<option value="'+esc(s)+'"'+(selected===s?' selected':'')+'>'+esc(s)+'</option>').join('');
}
function meetingUpdateStatusOptions(selected){
  selected = normalizeMeetingStatus(selected||'SCHEDULED');
  if(selected === 'NEEDS MEETING OUTCOME') selected = 'DONE';
  return MEETING_UPDATE_STATUSES.map(s=>'<option value="'+esc(s)+'"'+(selected===s?' selected':'')+'>'+esc(s)+'</option>').join('');

/* ==================== MANAGER: AGENT PERFORMANCE ====================== */

function agentPerfTotals(agents){
  return (agents||[]).reduce((t,a)=>{
    t.calls += Number(a.calls)||0;
    t.meaningful += Number(a.meaningful)||0;
    t.followups += Number(a.followups)||0;
    t.meetings += Number(a.meetings)||0;
    t.bids += Number(a.bids)||0;
    t.profilesSent += Number(a.profilesSent)||0;
    t.retryCases += Number(a.retryCases)||0;
    t.qualitySum += Number(a.qualityScore)||0;
    return t;
  },{calls:0,meaningful:0,followups:0,meetings:0,bids:0,profilesSent:0,retryCases:0,qualitySum:0});
}
function agentDisplayName(a){ return (a.name && a.name!==a.agent) ? (a.name+' ('+a.agent+')') : a.agent; }
function agentPerfActionCards(agents){
  const t = agentPerfTotals(agents);
  const conv = t.calls ? Math.round((t.meaningful/t.calls)*100) : 0;
  const avgQuality = agents.length ? Math.round(t.qualitySum / agents.length) : 0;
  return '<div class="cards">'+
    '<div class="stat-card" data-action="pf-open-work" data-agent="ALL" data-type="calls"><div class="num">'+t.calls+'</div><div class="lbl">Calls Logged</div><div class="sub">Click to see call trail</div></div>'+ 
    '<div class="stat-card" data-action="pf-open-work" data-agent="ALL" data-type="calls"><div class="num">'+t.meaningful+'</div><div class="lbl">Productive Calls</div><div class="sub">Meaningful pipeline movement</div></div>'+ 
    '<div class="stat-card" data-action="cc-open-list" data-key="meetings"><div class="num">'+t.meetings+'</div><div class="lbl">Meetings Set</div><div class="sub">Open Meetings Booked</div></div>'+ 
    '<div class="stat-card" data-action="cc-open-list" data-key="bids"><div class="num">'+t.bids+'</div><div class="lbl">Bid Opportunities</div><div class="sub">Open Bid Pipeline</div></div>'+ 
    '<div class="stat-card" data-action="pf-open-work" data-agent="ALL" data-type="calls"><div class="num">'+conv+'%</div><div class="lbl">Conversation Rate</div><div class="sub">Productive calls / total calls</div></div>'+ 
    '<div class="stat-card" data-action="pf-open-work" data-agent="ALL" data-type="calls"><div class="num">'+avgQuality+'</div><div class="lbl">Avg Quality Score</div><div class="sub">Weighted pipeline quality</div></div>'+ 
  '</div>';
}
function agentPerfRanking(agents, key, title, note){
  const rows = (agents||[]).slice().sort((a,b)=>(Number(b[key])||0)-(Number(a[key])||0)).slice(0,6);
  const max = Math.max(1, ...rows.map(a=>Number(a[key])||0));
  return '<div class="panel"><div class="section-title"><div><h2>'+esc(title)+'</h2><div class="sub" style="color:var(--muted)">'+esc(note||'')+'</div></div></div>'+ 
    '<div class="bar-list">'+rows.map(a=>{
      const val=Number(a[key])||0, pct=Math.round((val/max)*100);
      return '<div class="bar-row" data-action="pf-open-work" data-agent="'+esc(a.agent)+'" data-type="calls" style="cursor:pointer"><div class="bar-label">'+esc(agentDisplayName(a))+'</div>'+ 
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><div class="bar-value">'+val+(key==='conversion'?'%':'')+'</div></div>';
    }).join('')+'</div></div>';
}
function agentPerfTable(agents){
  if(!agents.length) return emptyHtml('📊','No calls logged in this range.');
  return '<div class="table-wrap"><table><thead><tr><th>Agent</th><th>Calls</th><th>Productive</th><th>Conv %</th><th>Follow-ups</th><th>Meetings</th><th>Bids</th><th>Profiles Sent</th><th>Retry</th><th>Quality</th><th>Last Activity</th><th></th></tr></thead><tbody>'+ 
    agents.map(a=>'<tr>'+ 
      '<td><b>'+esc(a.agent)+'</b><br><small style="color:var(--muted)">'+esc(a.name||'')+'</small></td>'+ 
      '<td>'+a.calls+'</td><td>'+a.meaningful+'</td><td>'+a.conversion+'%</td><td>'+a.followups+'</td>'+ 
      '<td>'+a.meetings+'</td><td>'+a.bids+'</td><td>'+a.profilesSent+'</td><td>'+a.retryCases+'</td>'+ 
      '<td><span class="score-bar"><i style="width:'+a.qualityScore+'%"></i></span> '+a.qualityScore+'</td>'+ 
      '<td class="nowrap">'+esc(a.lastActivity||'—')+'</td>'+

}
function agentPerfCoachingList(agents){
  if(!agents.length) return '';
  const rows = agents.slice().sort((a,b)=>(Number(b.calls)||0)-(Number(a.calls)||0));
  return '<div class="panel"><div class="section-title"><h2>Manager coaching view</h2><span class="sub" style="color:var(--muted)">Use this to guide daily coaching, not to punish agents.</span></div>'+ 
    '<div class="fu-grid">'+rows.map(a=>{
      const calls=Number(a.calls)||0, meaningful=Number(a.meaningful)||0, conv=Number(a.conversion)||0;
      let note='Keep momentum and look for next-step quality.';
      if(calls===0) note='No call activity in this range. Check attendance, target list, or app usage.';
      else if(calls>0 && meaningful===0) note='Many calls but no productive outcome yet. Review call opening and target quality.';
      else if(conv<20) note='Low conversion. Coach on qualifying questions and follow-up handling.';
      else if((Number(a.meetings)||0)+(Number(a.bids)||0)>0) note='Strong output. Review next steps so opportunities do not stall.';
      return '<div class="fu-card"><div class="co">'+esc(agentDisplayName(a))+'</div>'+ 
        '<div class="meta">Calls: <b>'+calls+'</b> · Productive: <b>'+meaningful+'</b> · Conv: <b>'+conv+'%</b></div>'+ 
        '<div class="notes">'+esc(note)+'</div>'+ 
        '<div class="fu-actions"><button class="btn btn-sm" data-action="pf-open-work" data-agent="'+esc(a.agent)+'" data-type="calls">View Work Trail</button></div></div>';
    }).join('')+'</div></div>';
}

  try{

function groupedCompaniesFromNumbers(numbers){

  (numbers||[]).forEach(n=>{
    const id=n.companyId||'';

    map[id].numbers.push(n);

  return Object.values(map);
}

    '<div class="contact-raw-box"><b>'+esc(r.label)+'</b><span>'+esc(r.value)+'</span></div>'
  ).join('')+'</div>'+extractedNumbersHtml(numbers);
}

function extractedNumbersHtml(numbers){
  numbers = numbers || [];
  if(!numbers.length){
    return '<div class="extracted-list"><b class="head">Extracted Numbers</b><div class="no-phone">No number was extracted into the clean-number layer. Check Original Phone Text, Original Mobile Text, and Other Contacts above.</div></div>';
  }
  return '<div class="extracted-list"><b class="head">Extracted Numbers</b>'+numbers.map(n=>{
    const status = String(n.validationStatus||'').toUpperCase();
    const pill = status==='REVIEW'?'pill-retry':(status==='VALID'?'pill-good':'pill-closed');
    const shown = n.displayNumber || n.dialNumber || n.normalizedNumber || n.rawNumber || '';
    return '<div class="extracted-item"><span class="pill '+pill+'">'+esc(status||'UNKNOWN')+'</span> '+
      '<b>'+esc(shown||'—')+'</b>'+(n.extension?' <span class="pill pill-neutral">loc '+esc(n.extension)+'</span>':'')+
      (n.validationNote?'<div style="color:var(--muted);margin-top:3px">Reason: '+esc(n.validationNote)+'</div>':'')+
      '<div class="orig-phone">Source '+esc(n.sourceField||'')+': “'+esc(n.originalText||'')+'”</div></div>';
  }).join('')+'</div>';
}

function numberGroupsByCompany(numbers){
  const map = {};
  (numbers||[]).forEach(n=>{
    const id = String(n.companyId||'');
    if(!id) return;
    if(!map[id]) map[id]=[];
    map[id].push(n);
  });
  return map;
}

function cleanupCompanyCardFromNumberGroup(g, reviewMap, bucket){
  const co = companyById(g.companyId) || {companyId:g.companyId, companyName:g.companyName};
  const nums = (g.numbers||[]);
  const statusSet = Array.from(new Set(nums.map(n=>String(n.validationStatus||'').toUpperCase()).filter(Boolean))).join(', ');
  const reason = statusSet==='REVIEW' ? 'Extracted number exists but needs human review before calling.' :
    (statusSet==='INVALID' ? 'Extracted number failed validation. Check the original text and correct the company record.' :
    'Review extracted numbers and original contact text.');
  return '<div class="hist-item"><div class="top"><span><b>'+esc(g.companyName||co.companyName||'Unknown company')+'</b> <small style="color:var(--muted)">'+esc(g.companyId)+'</small></span></div>'+ 
    reviewStatusHtml(g.companyId, reviewMap)+
    rawContactDetailsHtml(co, reason, nums)+
    phoneCompanyActionButtons(g.companyId, g.companyName||co.companyName, bucket)+'</div>';
}

function cleanupCompanyCardFromCompany(co, note, numbers, reviewMap, bucket){
  numbers = numbers || [];
  return '<div class="hist-item"><div class="top"><span><b>'+esc(co.companyName||'Unknown company')+'</b> <small style="color:var(--muted)">'+esc(co.companyId)+'</small></span>'+ 
    (co.category?' <span class="pill pill-neutral">'+esc(co.category)+'</span>':'')+'</div>'+ 
    reviewStatusHtml(co.companyId, reviewMap)+
    '<div class="reason-note">'+esc(note||'Review company contact details.')+'</div>'+ 
    '<div style="margin-top:5px">'+(phoneLine(co)||'<div class="no-phone">No clean phone number</div>')+'</div>'+ 
    rawContactDetailsHtml(co, note, numbers)+
    phoneCompanyActionButtons(co.companyId, co.companyName, bucket)+'</div>';
}

  const kind = d.kind;
  state.cleanupKind = kind || '';

  if(!box) return;
  box.innerHTML = loadingHtml('Loading review list…');
  try{
    const reviewData = await api('getContactReviewStatus',{});
    const reviewMap = reviewData.map || {};
    if(kind==='review' || kind==='invalid'){
      await ensureQueueLoaded();
      const status = kind==='review' ? 'REVIEW' : 'INVALID';
      const data = await api('getCompanyContactNumbers',{status});
      const groups = groupedCompaniesFromNumbers(data.numbers||[]);
      box.innerHTML = '<div class="section-title"><h2>'+(kind==='review'?'Needs Review':'Invalid Numbers')+' ('+groups.length+' companies)</h2></div>'+ 
        (groups.length ? groups.map(g=>cleanupCompanyCardFromNumberGroup(g, reviewMap, kind)).join('') : emptyHtml('✅','No companies in this bucket.'));
      return;
    }
    const q = await ensureQueueLoaded();
    let companies=[];

      companies = (q.companies||[]).filter(co=>!co.hasCleanPhone && (!co.phoneCount || co.phoneValidationStatus==='NONE'));
      box.innerHTML = '<div class="section-title"><h2>Companies with No Clean Number ('+companies.length+')</h2></div>'+

      return;
    }
    if(kind==='multi'){
      const numsData = await api('getCompanyContactNumbers',{});
      const numsByCompany = numberGroupsByCompany(numsData.numbers||[]);
      companies = (q.companies||[]).filter(co=>Number(co.phoneCount||0)>1);
      box.innerHTML = '<div class="section-title"><h2>Companies with Multiple Numbers ('+companies.length+')</h2></div>'+

function withTimeout(promise, ms, message){
  let timer;
  const timeout = new Promise((_, reject)=>{
    timer = setTimeout(()=>reject(new Error(message || 'Request timed out.')), ms);
  });
  return Promise.race([promise, timeout]).finally(()=>clearTimeout(timer));
}

ACTIONS['call-save']=async (el,d)=>{
  const resultEl=$('#cm-result');
  const dateEl=$('#cm-fudate');
  const errBox=$('#cm-save-error');
  const result=String(resultEl ? resultEl.value : '').toUpperCase().trim();
  const followUpDate=dateEl ? dateEl.value : '';
  if(errBox){ errBox.style.display='none'; errBox.innerHTML=''; }

  if(!result){ toast('Please select a call result','error'); return; }
  if(MEETING.has(result) && !followUpDate){ toast('Meeting Date is required for meeting set results','error'); return; }
  if(FOLLOWUP_RESULTS_FRONT.has(result) && !followUpDate){ toast('Follow-Up Date is required for this result','error'); return; }

  const originalText = el.textContent;
  el.disabled=true; el.textContent='Saving…';

  const payload={
    action:'logCall',
    mode: state.mode || 'DEMO',
    user: state.user && state.user.code ? state.user.code : '',
    by: state.user && state.user.code ? state.user.code : '',
    pin: state.pin || '',
    companyId: d.cid || '',
    companyName: d.cname || '',
    result: result,
    callResult: result,
    followUpDate: followUpDate,
    meetingDate: MEETING.has(result) ? followUpDate : '',
    nextFollowUpDate: followUpDate,
    clientEventName: ($('#cm-evname') ? $('#cm-evname').value.trim() : ''),
    clientEventDate: ($('#cm-evdate') ? $('#cm-evdate').value : ''),
    notes: ($('#cm-notes') ? $('#cm-notes').value.trim() : ''),
    _ts: String(Date.now())
  };

  const directUrl = API_URL + '?' + new URLSearchParams(payload).toString();

  try{
    if(!payload.user || !payload.by || !payload.pin){
      throw new Error('Missing logged-in user or PIN. Please logout and login again.');
    }
    console.log('B8.7 Save Call payload', payload);
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 20000);
    let res, txt, data;
    try{
      res = await fetch(directUrl, { signal: controller.signal, cache: 'no-store' });
      txt = await res.text();
    }finally{
      clearTimeout(timer);
    }
    try{
      data = JSON.parse(txt);
    }catch(parseErr){
      throw new Error('Backend did not return JSON while saving. Raw response: ' + String(txt||'').slice(0,250));
    }
    if(!data.ok){
      throw new Error(data.error || data.message || 'Backend rejected the call save.');
    }

    const isMeeting = result==='COMPANY PROFILE MEETING SET' || result==='PROJECT BRIEFING MEETING SET';
    if(isMeeting && data.meetingAlert && data.meetingAlert.sent){
      toast('Meeting logged — manager email alert sent','success');
    }else{
      toast(data.message || 'Call logged','success');
    }
    closeModal();
    state.lastReport=null; state.lastMgrReport=null; state.queue=null;
    renderTab(state.tab);
  }catch(e){
    const msg=e && e.name === 'AbortError'
      ? 'Save timed out after 20 seconds. The backend may still save it. Check the sheet before trying again.'
      : (e && e.message ? e.message : String(e || 'Call save failed.'));
    if(errBox){
      errBox.style.display='block';
      errBox.innerHTML='⚠ '+esc(msg)+
        '<br><br><b>Direct save URL for testing:</b><br>'+ 
        '<a href="'+esc(directUrl)+'" target="_blank" rel="noopener" style="color:var(--brand);word-break:break-all">Open direct save test</a>'+
        '<br><small style="color:var(--muted)">If this direct URL saves, the backend is okay and the browser fetch is being blocked or interrupted.</small>';
    }
    toast(msg,'error');
    el.disabled=false; el.textContent=originalText || 'Save Call';
  }
};

      co.title=fields.title; co.email=fields.email; co.phone=fields.phone; co.mobile=fields.mobile;
      co.otherContacts=fields.otherContacts; co.eventsParticipated=fields.eventsParticipated;
      co.possibleRequirements=fields.possibleRequirements;
    }
    toast(r.message,'success');
    closeModal();
    if(state.tab==='add') renderQueueList();
    if(state.tab==='cleanup') renderTab('cleanup');
  }catch(e){ toast(e.message,'error'); el.disabled=false; el.textContent='Save Company'; }
};

/* -------------------------------- boot -------------------------------- */
initLogin();
</script>
